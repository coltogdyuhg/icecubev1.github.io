<!DOCTYPE html>
<html>
<head>
    <title>ixl</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            position: relative;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            background-image: url(icecube2.webp);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation: fall linear infinite;
            animation-duration: 3s;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50%);
                opacity: 0;
            }
            100% {
                transform: translateY(100vh);
                opacity: 1;
            }
        }

        .top-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            box-shadow: 0 0 20px 5px rgba(128, 0, 128, 0.7);
            margin: 20px auto;
            position: relative;
            z-index: 2;
            width: auto;
        }

        .top-buttons a {
            margin: 0 10px;
        }

        button, .custom-button {
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid #4285f4;
            border-radius: 8px;
            color: #4285f4;
            padding: 15px 25px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-decoration: none; /* remove underline from a tags */
        }

        button:hover, .custom-button:hover {
            background-color: #4285f4;
            color: white;
        }
        
        .custom-button {
            color: red; /* Make the custom button text red */
        }

        .bottom-middle {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 20px;
        }

        .button-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 10px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            width: 80%;
            max-width: 800px;
        }

        .button-container button {
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="main-content">
    </div>

    <div class="top-buttons">
        <a href="real-home.html">
            <button>HOME</button>
        </a>
        <a href="real-games-rn 1.html">
            <button>GAMES</button>
        </a>
        <a href="apps.html">
            <button>APPS</button>
        </a>
    </div>

    <div class="button-container">
        <button style="color: red;">COMING SOON</button>
        <button style="color: red;">COMING SOON</button>
        <button style="color: red;">COMING SOON</button>
        <button style="color: red;">COMING SOON</button>
        <button style="color: red;">COMING SOON</button>
        <button style="color: red;">COMING SOON</button>
        <button style="color: red;">COMING SOON</button>
        <button style="color: red;">COMING SOON</button>
        <button style="color: red;">COMING SOON</button>
        <button style="color: red;">COMING SOON</button>
        <button style="color: red;">COMING SOON</button>
        <button style="color: red;">COMING SOON</button>
        <button style="color: red;">COMING SOON</button>
        <button style="color: red;">COMING SOON</button>
        <button style="color: red;">COMING SOON</button>
        <button style="color: red;">COMING SOON</button>
    </div>

    <script>
        function createStar() {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.left = `${Math.random() * 100}%`;
            star.style.animationDelay = `${Math.random() * 10}s`;
            star.style.top = `${Math.random() * -50}%`;
            document.body.appendChild(star);
        }

        for (let i = 0; i < 300; i++) {
            createStar();
        }

        setInterval(createStar, 300);
    </script>
</body>
</html>
