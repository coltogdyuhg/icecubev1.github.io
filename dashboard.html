<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearningSpot Dashboard</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #222;
            color: #FFD700;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            background-color: #333;
            align-items: center;
        }

        .account-menu {
            position: relative;
        }

        .account-button {
            background: none;
            border: none;
            color: #FFD700;
            cursor: pointer;
        }

        .account-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background-color: #444;
            border-radius: 5px;
            padding: 10px;
            display: none;
            flex-direction: column;
            align-items: flex-start;
        }

        .account-dropdown.show {
            display: flex;
        }

        .account-dropdown button {
            background: none;
            border: none;
            color: #FFD700;
            cursor: pointer;
            padding: 5px 10px;
            text-align: left;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard-tab {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 10px;
            width: 80%;
            max-width: 600px;
            text-align: left;
        }

        .grade-title {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .lesson-buttons {
            display: flex;
            flex-wrap: wrap;
        }

        .lesson-buttons button {
            background-color: #4169E1;
            color: #FFD700;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }
        .warning-text {
          margin-top: 20px;
          color: red;
          font-weight: bold;
        }

        .footer {
            text-align: center;
            padding: 20px;
            background-color: #333;
        }
    </style>
</head>
<body>
    <div class="header">
        <div></div>
        <div class="account-menu">
            <button class="account-button" onclick="toggleAccountMenu()">Account</button>
            <div class="account-dropdown" id="accountDropdown">
                <div>Hi User</div>
                <button onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="dashboard-tab">
            <div class="grade-title">7th Grade</div>
            <div class="lesson-buttons">
                <button>a.1</button>
                <button>a.2</button>
                <button>a.3</button>
                </div>
            <div class="warning-text">WARNING: LearningSpot is still in development</div>
        </div>
    </div>

    <div class="footer">
        Copyright LearningSpot 2025
    </div>

    <script>
        function toggleAccountMenu() {
            document.getElementById('accountDropdown').classList.toggle('show');
        }

        function logout() {
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
