<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Icecube</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>

  <style>
    body {
      background-color: black;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .star {
      position: absolute;
      background-color: white;
      border-radius: 50%;
      opacity: 0.5;
      animation: twinkle 2s ease-in-out infinite, float 180s linear infinite;
      z-index: 0;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(3vw, -2vh); }
    }

    .sidebar {
      background-color: #111;
      color: #87CEEB;
      width: 50px;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
      overflow-x: hidden;
      transition: width 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
      padding-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: none;
    }

    .sidebar.expanded {
      width: 200px;
      align-items: flex-start;
      box-shadow: 0 0 15px #87CEEB;
    }

    .hamburger-icon {
      font-size: 1.5em;
      cursor: pointer;
      padding: 10px;
      margin-bottom: 20px;
      text-shadow: 0 0 5px #87CEEB;
    }

    .menu-items {
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100%;
    }

    .menu-items li {
      padding: 15px 20px;
      color: #87CEEB;
      display: block;
      opacity: 0;
      transform: translateX(-20px);
      transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
    }

    .sidebar.expanded .menu-items li {
      opacity: 1;
      transform: translateX(0);
      transition-delay: 0.2s;
    }

    .menu-items li:hover {
      color: #ADD8E6;
      text-shadow: 0 0 8px #ADD8E6;
      cursor: pointer;
    }

    .content {
      margin-left: 50px;
      transition: margin-left 0.3s ease-in-out;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 20px;
      justify-items: center;
      z-index: 1;
      position: relative;
    }

    .sidebar.expanded ~ .content {
      margin-left: 200px;
    }

    .image-container {
      width: 150px;
      height: 150px;
      border: 1px solid #333;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border-radius: 10px;
      display: block;
      text-decoration: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      z-index: 1;
    }

    .image-container:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #87CEEB;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s ease-in-out;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2em;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      border-radius: 10px;
    }

    .image-container:hover .overlay {
      opacity: 1;
    }

    .overlay-text {
      color: white;
    }
  </style>

  <script>
    function toggleMenu() {
      const sidebar = document.querySelector('.sidebar');
      sidebar.classList.toggle('expanded');
    }

    function generateStars() {
      const starContainer = document.body;
      for (let i = 0; i < 100; i++) {
        const star = document.createElement("div");
        star.classList.add("star");
        const size = Math.random() * 3 + 1 + "px";
        const top = Math.random() * 100 + "%";
        const left = Math.random() * 100 + "%";
        star.style.width = size;
        star.style.height = size;
        star.style.top = top;
        star.style.left = left;
        starContainer.appendChild(star);
      }
    }

    window.onload = generateStars;
  </script>
</head>
