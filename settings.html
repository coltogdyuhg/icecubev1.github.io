<!DOCTYPE html>
<html>
<head>
    <title>Settings</title>
    <style>
        body {
            background-image: url(icecube2.webp);
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        .settings-box {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 600px;
            text-align: center;
            position: relative;
            color: white;
            z-index: 2;
            margin-top: 50px;
        }

        .settings-title {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            padding: 5px 15px;
            border-radius: 5px;
            font-weight: bold;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation: fall linear;
            animation-duration: 3s;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50vh);
                opacity: 0;
            }
            80%{
                opacity: 1;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        .top-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            box-shadow: 0 0 20px 5px rgba(128, 0, 128, 0.7);
            position: relative;
            z-index: 2;
            width: 80%; /* Increased width */
            max-width: 800px; /*increased max width*/
            margin-top: 20px;
        }

        .top-buttons a {
            margin: 0 10px;
        }

        button {
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid #4285f4;
            border-radius: 8px;
            color: #4285f4;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        button:hover {
            background-color: #4285f4;
            color: white;
        }

    </style>
</head>
<body>

    <div class="top-buttons">
        <a href="home.html"><button>HOME</button></a>
        <a href="real-games-rn 1.html"><button>GAMES</button></a>
        <a href="apps.html"><button>APPS</button></a>
    </div>

    <div class="settings-box">
        <div class="settings-title">Settings</div>
        <p>Coming Soon</p>
        <p>More settings...</p>
    </div>

    <script>
        function createStar() {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.left = `${Math.random() * 100}%`;
            star.style.animationDelay = `${Math.random() * 3}s`;
            star.style.top = `${Math.random() * -50}vh`;
            star.style.width = `${Math.random() * 2 + 2}px`;
            star.style.height = star.style.width;

            star.addEventListener('animationend', () => {
                star.remove();
            });

            document.body.appendChild(star);
        }

        function populateStars(count) {
            for (let i = 0; i < count; i++) {
                createStar();
            }
        }

        populateStars(150);

        setInterval(createStar, 100);
    </script>

</body>
</html>
